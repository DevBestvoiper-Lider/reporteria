<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Reportería - Documentación Swagger</title>
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@5.10.5/swagger-ui.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1e40af;
            --primary-dark: #1e3a8a;
            --primary-light: #3b82f6;
            --primary-gradient: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
            --success-color: #059669;
            --warning-color: #d97706;
            --danger-color: #dc2626;
            --info-color: #0891b2;
            --purple-color: #7c3aed;
            --pink-color: #db2777;
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --text-muted: #9ca3af;
            --bg-light: #f9fafb;
            --bg-white: #ffffff;
            --bg-gray: #f3f4f6;
            --border-color: #e5e7eb;
            --border-light: #f3f4f6;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        * {
            box-sizing: border-box;
        }

        html {
            overflow: -moz-scrollbars-vertical;
            overflow-y: scroll;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 50%, #6366f1 100%);
            background-attachment: fixed;
            min-height: 100vh;
        }

        /* Header personalizado */
        .custom-header {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            padding: 2.5rem 0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border-bottom: 1px solid var(--border-light);
            top: 0;
            z-index: 100;
        }

        .custom-header .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        .custom-header h1 {
            margin: 0 0 0.75rem 0;
            font-size: 2.75rem;
            font-weight: 800;
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 50%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.025em;
            line-height: 1.2;
        }

        .custom-header p {
            margin: 0;
            color: var(--text-secondary);
            font-size: 1.125rem;
            font-weight: 400;
            line-height: 1.6;
        }

        .custom-header .badges {
            display: flex;
            gap: 0.75rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
            gap: 0.5rem;
            transition: all 0.3s ease;
            border: 1.5px solid transparent;
        }

        .badge:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .badge-primary {
            background: linear-gradient(135deg, rgba(30, 64, 175, 0.1), rgba(59, 130, 246, 0.1));
            color: var(--primary-color);
            border-color: rgba(30, 64, 175, 0.2);
        }

        .badge-success {
            background: linear-gradient(135deg, rgba(5, 150, 105, 0.1), rgba(16, 185, 129, 0.1));
            color: var(--success-color);
            border-color: rgba(5, 150, 105, 0.2);
        }

        .badge-warning {
            background: linear-gradient(135deg, rgba(217, 119, 6, 0.1), rgba(245, 158, 11, 0.1));
            color: var(--warning-color);
            border-color: rgba(217, 119, 6, 0.2);
        }

        /* Contenedor principal */
        .swagger-container {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 2rem 3rem;
            background: var(--bg-white);
            border-radius: 1.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12), 0 2px 10px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        /* Ocultar topbar por defecto de Swagger */
        .topbar {
            display: none !important;
        }

        /* Estilos personalizados de Swagger UI */
        .swagger-ui {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .swagger-ui .info {
            margin: 2rem 0;
        }

        .swagger-ui .info .title {
            font-size: 2rem;
            color: var(--text-primary);
            font-weight: 700;
        }

        .swagger-ui .info .description {
            color: var(--text-secondary);
            font-size: 1rem;
            line-height: 1.6;
        }

        .swagger-ui .scheme-container {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            box-shadow: var(--shadow-lg);
            border-radius: 0.75rem;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .swagger-ui .opblock-tag {
            border-bottom: 2px solid var(--border-light);
            padding: 1.75rem 0;
            transition: all 0.3s ease;
            margin-bottom: 1rem;
        }

        .swagger-ui .opblock-tag:hover {
            border-bottom-color: var(--primary-light);
            padding-left: 0.5rem;
        }

        .swagger-ui .opblock-tag-section h3 {
            font-size: 1.625rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.025em;
        }

        .swagger-ui .opblock {
            border-radius: 0.75rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            margin-bottom: 1.25rem;
            border: 1.5px solid var(--border-light);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        .swagger-ui .opblock:hover {
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            transform: translateY(-3px);
            border-color: var(--border-color);
        }

        .swagger-ui .opblock.opblock-post {
            border-left: 5px solid var(--success-color);
            background: linear-gradient(to right, rgba(5, 150, 105, 0.02), transparent);
        }

        .swagger-ui .opblock.opblock-get {
            border-left: 5px solid var(--primary-color);
            background: linear-gradient(to right, rgba(30, 64, 175, 0.02), transparent);
        }

        .swagger-ui .opblock.opblock-put {
            border-left: 5px solid var(--warning-color);
            background: linear-gradient(to right, rgba(217, 119, 6, 0.02), transparent);
        }

        .swagger-ui .opblock.opblock-delete {
            border-left: 5px solid var(--danger-color);
            background: linear-gradient(to right, rgba(220, 38, 38, 0.02), transparent);
        }

        .swagger-ui .opblock-summary-method {
            border-radius: 0.5rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 0.625rem 1.25rem;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            box-shadow: var(--shadow-sm);
        }

        .swagger-ui .btn {
            border-radius: 0.625rem;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
            padding: 0.75rem 1.5rem;
            border: none;
        }

        .swagger-ui .btn:hover {
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
            transform: translateY(-2px);
        }

        .swagger-ui .btn:active {
            transform: translateY(0);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }

        .swagger-ui .btn.authorize {
            background: linear-gradient(135deg, #1e40af, #3b82f6);
            border: none;
            color: white;
            font-weight: 700;
        }

        .swagger-ui .btn.authorize:hover {
            background: linear-gradient(135deg, #1e3a8a, #2563eb);
        }

        .swagger-ui .btn.execute {
            background: linear-gradient(135deg, #059669, #10b981);
            border: none;
            color: white;
            font-weight: 700;
        }

        .swagger-ui .btn.execute:hover {
            background: linear-gradient(135deg, #047857, #059669);
        }

        .swagger-ui .response-col_status {
            font-weight: 600;
        }

        .swagger-ui .model-box {
            border-radius: 0.75rem;
            background: var(--bg-light);
            border: 1.5px solid var(--border-light);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.02);
        }

        .swagger-ui .model-title {
            font-weight: 700;
            color: var(--text-primary);
            font-size: 1.125rem;
        }

        .swagger-ui table thead tr th {
            font-weight: 700;
            color: var(--text-primary);
            background: linear-gradient(to bottom, var(--bg-light), var(--bg-gray));
            border-bottom: 2px solid var(--border-color);
            padding: 1rem;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }

        .swagger-ui table tbody tr {
            transition: background-color 0.2s ease;
        }

        .swagger-ui table tbody tr:hover {
            background: var(--bg-light);
        }

        .swagger-ui .parameter__name {
            font-weight: 700;
            color: var(--text-primary);
            font-size: 0.9375rem;
        }

        .swagger-ui .parameter__type {
            color: var(--primary-color);
            font-weight: 600;
            background: rgba(30, 64, 175, 0.08);
            padding: 0.25rem 0.5rem;
            border-radius: 0.375rem;
            font-size: 0.8125rem;
        }

        .swagger-ui .response-col_description {
            color: var(--text-secondary);
            line-height: 1.6;
        }

        /* Scroll suave */
        html {
            scroll-behavior: smooth;
        }

        /* Animación de carga */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .swagger-container {
            animation: fadeIn 0.6s ease-out;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .custom-header h1 {
                font-size: 1.875rem;
            }

            .custom-header p {
                font-size: 1rem;
            }

            .swagger-container {
                padding: 0 1rem 2rem;
                border-radius: 0;
            }

            .custom-header .container {
                padding: 0 1rem;
            }
        }

        /* Tag colors personalizados */
        .swagger-ui .opblock-tag[data-tag="Autenticación"] {
            border-left: 5px solid var(--primary-color);
            padding-left: 1.25rem;
            background: linear-gradient(to right, rgba(30, 64, 175, 0.03), transparent);
        }

        .swagger-ui .opblock-tag[data-tag="Consumo"] {
            border-left: 5px solid var(--success-color);
            padding-left: 1.25rem;
            background: linear-gradient(to right, rgba(5, 150, 105, 0.03), transparent);
        }

        .swagger-ui .opblock-tag[data-tag="Reportes CDR"] {
            border-left: 5px solid var(--warning-color);
            padding-left: 1.25rem;
            background: linear-gradient(to right, rgba(217, 119, 6, 0.03), transparent);
        }

        .swagger-ui .opblock-tag[data-tag="Reportes de Consumo"] {
            border-left: 5px solid var(--purple-color);
            padding-left: 1.25rem;
            background: linear-gradient(to right, rgba(124, 58, 237, 0.03), transparent);
        }

        .swagger-ui .opblock-tag[data-tag="Histórico de Pagos"] {
            border-left: 5px solid var(--info-color);
            padding-left: 1.25rem;
            background: linear-gradient(to right, rgba(8, 145, 178, 0.03), transparent);
        }

        .swagger-ui .opblock-tag[data-tag="Mi Cuenta"] {
            border-left: 5px solid var(--pink-color);
            padding-left: 1.25rem;
            background: linear-gradient(to right, rgba(219, 39, 119, 0.03), transparent);
        }

        /* Filter box */
        .swagger-ui .filter-container {
            border-radius: 0.75rem;
            border: 2px solid var(--border-color);
            transition: all 0.3s ease;
            background: var(--bg-white);
            box-shadow: var(--shadow-sm);
        }

        .swagger-ui .filter-container:focus-within {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(30, 64, 175, 0.1), var(--shadow-md);
        }

        .swagger-ui .filter-container input {
            padding: 0.875rem 1rem;
        }

        /* Response section */
        .swagger-ui .responses-inner {
            padding: 1.5rem;
            background: var(--bg-light);
            border-radius: 0.75rem;
        }

        .swagger-ui .response-col_status {
            font-weight: 700;
            font-size: 0.9375rem;
        }

        /* Code highlighting */
        .swagger-ui .highlight-code {
            border-radius: 0.75rem;
            border: 1.5px solid var(--border-light);
        }

        /* Authorization modal */
        .swagger-ui .dialog-ux .modal-ux-content {
            border-radius: 1rem;
            box-shadow: var(--shadow-xl);
        }

        /* Info section */
        .swagger-ui .information-container {
            padding: 2rem;
            background: linear-gradient(to bottom, var(--bg-light), var(--bg-white));
            border-radius: 0.75rem;
            margin-bottom: 2rem;
            border: 1.5px solid var(--border-light);
        }

        .swagger-ui .info .title {
            font-size: 2.25rem;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.025em;
            margin-bottom: 1rem;
        }

        .swagger-ui .info .description {
            color: var(--text-secondary);
            font-size: 1.0625rem;
            line-height: 1.75;
        }
    </style>
</head>
<body>
    <div class="custom-header">
        <div class="container">
            <h1><img src="../../../views/img/logos/logo.png" width="150"> API Reportería</h1>
            <p>Sistema de reportes telefónicos - Documentación de API REST</p>
            <div class="badges">
                <span class="badge badge-primary">
                    <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">

                    </svg>
                    v1.0.0
                </span>
                <span class="badge badge-success">
                    <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">

                    Autenticación JWT
                </span>
                <span class="badge badge-warning">
                    <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M8 4.754a3.246 3.246 0 1 0 0 6.492 3.246 3.246 0 0 0 0-6.492zM5.754 8a2.246 2.246 0 1 1 4.492 0 2.246 2.246 0 0 1-4.492 0z"/>

                    </svg>
                    REST API
                </span>
            </div>
        </div>
    </div>

    <div class="swagger-container">
        <div id="swagger-ui"></div>
    </div>

    <script src="https://unpkg.com/swagger-ui-dist@5.10.5/swagger-ui-bundle.js"></script>
    <script src="https://unpkg.com/swagger-ui-dist@5.10.5/swagger-ui-standalone-preset.js"></script>
    <script>
        window.onload = function() {
            const ui = SwaggerUIBundle({
                url: "swagger.json",
                dom_id: '#swagger-ui',
                deepLinking: true,
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIStandalonePreset
                ],
                plugins: [
                    SwaggerUIBundle.plugins.DownloadUrl
                ],
                layout: "StandaloneLayout",
                persistAuthorization: true,
                tryItOutEnabled: true,
                filter: true,
                displayRequestDuration: true,
                syntaxHighlight: {
                    activate: true,
                    theme: "monokai"
                },
                requestSnippetsEnabled: true,
                requestSnippets: {
                    generators: {
                        curl_bash: {
                            title: "cURL (bash)",
                            syntax: "bash"
                        },
                        curl_powershell: {
                            title: "cURL (PowerShell)",
                            syntax: "powershell"
                        },
                        curl_cmd: {
                            title: "cURL (CMD)",
                            syntax: "bash"
                        }
                    }
                }
            });

            window.ui = ui;
        };
    </script>
</body>
</html>
